name: Hent innhold

# Kjøres hvert 10. minutt. GitHubs cron-tidsplan er upålitelig (kan bli forsinket i timer),
# så hver kjøring starter i tillegg den neste selv via workflow_dispatch når den er ferdig.
# Tidsplanen står igjen som reserve hvis kjeden skulle brytes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "sources.json"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: hent-innhold
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Noter starttid
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hent fra kildene
        env:
          # Valgfritt: gir fulle Reddit-tråder. Se README.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node scripts/fetch.mjs

      - name: Commit og push data
        run: |
          git config user.name "bedeem-bot"
          git config user.email "bot@bedeem.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Ingen endringer i data."
            exit 0
          fi
          git commit -m "data: oppdatert $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Vent til neste runde og start neste kjøring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          wait=$(( 600 - elapsed ))
          if [ "$wait" -gt 0 ]; then
            echo "Venter $wait s så det blir ca. 10 minutter mellom kjøringene."
            sleep "$wait"
          fi
          # Start bare neste kjøring hvis ingen annen allerede venter eller kjører (unngår doble kjeder).
          others=$(gh run list --workflow fetch.yml --status queued --json databaseId --jq length)
          running=$(gh run list --workflow fetch.yml --status in_progress --json databaseId --jq length)
          echo "I kø: $others, kjører: $running (inkludert denne)"
          if [ "$others" -eq 0 ] && [ "$running" -le 1 ]; then
            gh workflow run fetch.yml --ref main
            echo "Neste kjøring startet."
          else
            echo "En annen kjøring tar over kjeden."
          fi
